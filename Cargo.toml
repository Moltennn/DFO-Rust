[package]
name = "dfo-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "macros"] }
tower-http = { version = "0.7.1", features = ["fs"] }
webkit2gtk = "2.0.2"
wry = { version = "0.57.1", features = ["devtools"] }
