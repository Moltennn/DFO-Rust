[package]
name = "dfo-shell"
version = "0.1.0"
edition = "2024"
description = "An experimental native GTK4 shell for DFO Online"
license = "MIT"
repository = "https://github.com/Moltennn/DFO-Rust"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
gtk4 = { version = "0.11", features = ["v4_10"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "macros"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
